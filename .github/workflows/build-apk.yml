name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DriveSequencer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save the APK to the "apk" branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/DriveSequencer.apk
          cd /tmp/out && git init -q -b apk && git add DriveSequencer.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - name: Publish the APK as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriveSequencer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DriveSequencer.apk --latest \
            --title "Drive Sequencer (latest build)" \
            --notes "Download **DriveSequencer.apk** below and open it on an Android phone (Android 8.0 or newer). Built automatically from commit ${GITHUB_SHA}."
